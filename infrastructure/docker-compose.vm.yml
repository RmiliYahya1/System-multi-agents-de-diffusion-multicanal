version: '3.8'

networks:
  diffusion-network:
    driver: bridge
    name: diffusion-network

services:
  # ─── Nginx (Reverse Proxy) ───
  nginx:
    image: nginx:1.25-alpine
    container_name: diffusion-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - diffusion-network
    depends_on:
      n8n-main:
        condition: service_healthy
      kong:
        condition: service_healthy

  # ─── PostgreSQL ───
  postgres:
    image: postgres:16-alpine
    container_name: diffusion-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: diffusion_db
      POSTGRES_USER: diffusion_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: Africa/Casablanca
      PGTZ: Africa/Casablanca
    volumes:
      - diffusion-vm-pg-data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d
    command: >
      postgres
        -c max_connections=100
        -c shared_buffers=256MB
        -c work_mem=8MB
        -c effective_cache_size=768MB
        -c maintenance_work_mem=128MB
        -c checkpoint_completion_target=0.9
        -c wal_buffers=16MB
        -c random_page_cost=1.1
        -c effective_io_concurrency=200
        -c min_wal_size=1GB
        -c max_wal_size=4GB
        -c log_timezone=Africa/Casablanca
        -c timezone=Africa/Casablanca
        -c log_min_duration_statement=500
        -c log_statement=mod
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U diffusion_admin -d diffusion_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - diffusion-network

  # ─── pgAdmin ───
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: diffusion-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
      PGADMIN_LISTEN_PORT: 5050
    ports:
      - "5050:5050"
    volumes:
      - diffusion-vm-pgadmin-data:/var/lib/pgadmin
    networks:
      - diffusion-network
    depends_on:
      postgres:
        condition: service_healthy

  # ─── Redis ───
  redis:
    image: redis:7-alpine
    container_name: diffusion-redis
    restart: unless-stopped
    command: >
      redis-server
        --maxmemory 256mb
        --maxmemory-policy noeviction
        --appendonly yes
        --save 60 1000
        --requirepass ${REDIS_PASSWORD}
    volumes:
      - diffusion-vm-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - diffusion-network

  # ─── Queue Service ───
  queue-service:
    build: ./queue-service
    container_name: diffusion-queue-service
    restart: unless-stopped
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      N8N_WEBHOOK_BASE_URL: http://n8n-main:5678
      QUEUE_SERVICE_PORT: 3002
    networks:
      - diffusion-network
    depends_on:
      redis:
        condition: service_healthy

  # ─── n8n Main ───
  n8n-main:
    image: n8nio/n8n:2.18.7
    container_name: diffusion-n8n-main
    restart: unless-stopped
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=diffusion_db
      - DB_POSTGRESDB_USER=diffusion_admin
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - EXECUTIONS_MODE=queue
      - QUEUE_BULL_REDIS_HOST=redis
      - QUEUE_BULL_REDIS_PORT=6379
      - QUEUE_BULL_REDIS_PASSWORD=${REDIS_PASSWORD}
      - N8N_HOST=n8n-main
      - N8N_PORT=5678
      - WEBHOOK_URL=${WEBHOOK_URL:-http://localhost/}
      - GENERIC_TIMEZONE=Africa/Casablanca
    volumes:
      - diffusion-vm-n8n-main-data:/home/node/.n8n
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5678/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - diffusion-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ─── n8n Worker ───
  n8n-worker:
    image: n8nio/n8n:2.18.7
    container_name: diffusion-n8n-worker
    restart: unless-stopped
    command: worker
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=diffusion_db
      - DB_POSTGRESDB_USER=diffusion_admin
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - EXECUTIONS_MODE=queue
      - QUEUE_BULL_REDIS_HOST=redis
      - QUEUE_BULL_REDIS_PORT=6379
      - QUEUE_BULL_REDIS_PASSWORD=${REDIS_PASSWORD}
      - GENERIC_TIMEZONE=Africa/Casablanca
      - WEBHOOK_URL=${WEBHOOK_URL:-http://localhost/}
    volumes:
      - diffusion-vm-n8n-worker-data:/home/node/.n8n
    networks:
      - diffusion-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ─── Kong API Gateway ───
  kong:
    image: kong:3.6
    container_name: diffusion-kong
    restart: unless-stopped
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /usr/local/kong/declarative/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
    volumes:
      - ./kong/kong.yml:/usr/local/kong/declarative/kong.yml:ro
    healthcheck:
      test: ["CMD-SHELL", "kong health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - diffusion-network
    depends_on:
      n8n-main:
        condition: service_healthy

  # ─── Vault ───
  vault:
    image: hashicorp/vault:1.15
    container_name: diffusion-vault
    restart: unless-stopped
    command: server -config=/vault/config/vault.hcl
    cap_add:
      - IPC_LOCK
    ports:
      - "8200:8200"
    volumes:
      - ./scripts:/vault/scripts:ro
      - ./vault-config/vault.hcl:/vault/config/vault.hcl:ro
      - diffusion-vm-vault-data:/vault/data
    networks:
      - diffusion-network

  # ─── Prometheus ───
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: diffusion-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.external-url=/prometheus/'
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - diffusion-vm-prometheus-data:/prometheus
    networks:
      - diffusion-network
    depends_on:
      - queue-service

  # ─── Grafana ───
  grafana:
    image: grafana/grafana:10.4.0
    container_name: diffusion-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GF_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=%(protocol)s://%(domain)s:%(http_port)s/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
    volumes:
      - diffusion-vm-grafana-data:/var/lib/grafana
    networks:
      - diffusion-network
    depends_on:
      - postgres
      - prometheus

volumes:
  diffusion-vm-pg-data:
    name: diffusion-vm-pg-data
  diffusion-vm-pgadmin-data:
    name: diffusion-vm-pgadmin-data
  diffusion-vm-redis-data:
    name: diffusion-vm-redis-data
  diffusion-vm-n8n-main-data:
    name: diffusion-vm-n8n-main-data
  diffusion-vm-n8n-worker-data:
    name: diffusion-vm-n8n-worker-data
  diffusion-vm-prometheus-data:
    name: diffusion-vm-prometheus-data
  diffusion-vm-grafana-data:
    name: diffusion-vm-grafana-data
  diffusion-vm-vault-data:
    name: diffusion-vm-vault-data
