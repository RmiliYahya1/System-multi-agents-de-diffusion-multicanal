_format_version: "3.0"
services:
  - name: nginx-proxy
    url: http://n8n-main:5678
    routes:
      - name: diffusion-webhook
        paths:
          - /webhook/
        strip_path: false
    plugins:
      - name: jwt
        config:
          claims_to_verify:
            - exp

# Déclaration du premier client (Tenant)
consumers:
  - username: client_demo_01

jwt_secrets:
  - consumer: client_demo_01
    key: "emetteur_demo_01"          # Identifiant 'iss' dans le JWT
    secret: "${KONG_JWT_SECRET}"          # Clé de signature privée
    algorithm: HS256