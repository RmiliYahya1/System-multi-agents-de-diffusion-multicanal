apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: workflow-engine
    app.kubernetes.io/instance: n8n-main
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: n8n-main
    app.kubernetes.io/part-of: diffusion-platform
    app.kubernetes.io/version: 2.18.7
    environment: dev
    layer: app
  name: dev-n8n-main
  namespace: dev-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: n8n-main
      app.kubernetes.io/part-of: diffusion-platform
      environment: dev
      layer: app
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      annotations:
        prometheus.io/path: /metrics
        prometheus.io/port: "5678"
        prometheus.io/scrape: "true"
      labels:
        app: n8n-main
        app.kubernetes.io/component: workflow-engine
        app.kubernetes.io/instance: n8n-main
        app.kubernetes.io/managed-by: kustomize
        app.kubernetes.io/name: n8n-main
        app.kubernetes.io/part-of: diffusion-platform
        app.kubernetes.io/version: 2.18.7
        environment: dev
        layer: app
    spec:
      containers:
      - env:
        - name: WEBHOOK_URL
          value: http://n8n-main:5678/
        - name: DB_POSTGRESDB_PASSWORD
          valueFrom:
            secretKeyRef:
              key: POSTGRES_PASSWORD
              name: dev-diffusion-secrets
        - name: QUEUE_BULL_REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              key: REDIS_PASSWORD
              name: dev-diffusion-secrets
        - name: N8N_ENCRYPTION_KEY
          valueFrom:
            secretKeyRef:
              key: N8N_ENCRYPTION_KEY
              name: dev-diffusion-secrets
        - name: VAULT_ROOT_TOKEN
          valueFrom:
            secretKeyRef:
              key: VAULT_TOKEN
              name: dev-diffusion-secrets
        envFrom:
        - configMapRef:
            name: dev-n8n-config
        image: n8nio/n8n:2.18.7
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 5
          httpGet:
            path: /healthz
            port: 5678
          initialDelaySeconds: 60
          periodSeconds: 15
        name: n8n-main
        ports:
        - containerPort: 5678
          name: http
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /healthz
            port: 5678
          initialDelaySeconds: 30
          periodSeconds: 10
        resources:
          limits:
            cpu: "2"
            memory: 512Mi
          requests:
            cpu: 500m
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        startupProbe:
          failureThreshold: 60
          httpGet:
            path: /healthz
            port: 5678
          periodSeconds: 10
        volumeMounts:
        - mountPath: /home/node/.n8n
          name: n8n-home
        - mountPath: /home/node/.cache
          name: n8n-cache
        - mountPath: /tmp
          name: tmp
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 60
      volumes:
      - emptyDir: {}
        name: n8n-home
      - emptyDir: {}
        name: n8n-cache
      - emptyDir: {}
        name: tmp
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: worker
    app.kubernetes.io/instance: n8n-worker
    app.kubernetes.io/managed-by: kustomize
