      app: kong
      app.kubernetes.io/part-of: diffusion-platform
      environment: dev
      layer: gateway
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: kong
        app.kubernetes.io/component: gateway
        app.kubernetes.io/instance: kong
        app.kubernetes.io/managed-by: kustomize
        app.kubernetes.io/name: kong
        app.kubernetes.io/part-of: diffusion-platform
        app.kubernetes.io/version: 3.6.1
        environment: dev
        layer: gateway
    spec:
      containers:
      - envFrom:
        - configMapRef:
            name: dev-kong-runtime-config
        image: kong:3.6.1
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /status
            port: 8001
          periodSeconds: 30
        name: kong
        ports:
        - containerPort: 8000
          name: proxy
        - containerPort: 8001
          name: admin
        readinessProbe:
          httpGet:
            path: /status
            port: 8001
          initialDelaySeconds: 15
          periodSeconds: 10
        resources:
          limits:
            cpu: 500m
            memory: 1Gi
          requests:
            cpu: 100m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        startupProbe:
          failureThreshold: 30
          httpGet:
            path: /status
            port: 8001
          periodSeconds: 5
        volumeMounts:
        - mountPath: /usr/local/kong
          name: kong-writable
        - mountPath: /usr/local/kong/declarative
          name: kong-config-rendered
        - mountPath: /usr/local/kong/pids
          name: kong-pids
        - mountPath: /tmp
          name: tmp
        - mountPath: /usr/local/kong/logs
