apiVersion: batch/v1
kind: CronJob
metadata:
  labels:
    app.kubernetes.io/component: backup
    app.kubernetes.io/instance: postgres-backup
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: postgres-backup
    app.kubernetes.io/part-of: diffusion-platform
    environment: dev
    layer: data
  name: dev-postgres-backup
  namespace: dev-data
spec:
  failedJobsHistoryLimit: 1
  jobTemplate:
    metadata:
      labels:
        app.kubernetes.io/part-of: diffusion-platform
        environment: dev
        layer: data
    spec:
      activeDeadlineSeconds: 1800
      backoffLimit: 3
      template:
        metadata:
          labels:
            app.kubernetes.io/component: backup
            app.kubernetes.io/name: postgres-backup
            app.kubernetes.io/part-of: diffusion-platform
            environment: dev
            layer: data
        spec:
          containers:
          - command:
            - /bin/sh
            - -c
            - |
              DATE=$(date +%Y%m%d_%H%M%S)
              echo "Starting PostgreSQL backup: diffusion_db_backup_$DATE.sql.gz"
              export PGPASSWORD=$POSTGRES_PASSWORD
              pg_dump -h postgres -U diffusion_admin -d diffusion_db | gzip > /tmp/diffusion_db_backup_$DATE.sql.gz
              cp /tmp/diffusion_db_backup_$DATE.sql.gz /backups/diffusion_db_backup_$DATE.sql.gz
              echo "Backup completed successfully."
              find /backups -name "diffusion_db_backup_*.sql.gz" -type f -mtime +7 -delete
            env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: POSTGRES_PASSWORD
                  name: dev-diffusion-secrets
            image: postgres:16.6-alpine
            imagePullPolicy: IfNotPresent
            name: pg-backup
            resources:
              limits:
                memory: 512Mi
              requests:
                cpu: 100m
                memory: 128Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                - ALL
              readOnlyRootFilesystem: true
            volumeMounts:
            - mountPath: /backups
              name: backup-storage
            - mountPath: /tmp
              name: tmp
          restartPolicy: OnFailure
          securityContext:
            fsGroup: 70
            runAsGroup: 70
            runAsNonRoot: true
            runAsUser: 70
            seccompProfile:
              type: RuntimeDefault
          volumes:
          - name: backup-storage
            persistentVolumeClaim:
              claimName: dev-backups-pvc
          - emptyDir: {}
            name: tmp
  schedule: 0 3 * * *
  successfulJobsHistoryLimit: 3
---
apiVersion: batch/v1
kind: CronJob
metadata:
  labels:
    app.kubernetes.io/component: backup
    app.kubernetes.io/instance: redis-backup
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: redis-backup
    app.kubernetes.io/part-of: diffusion-platform
    environment: dev
    layer: data
  name: dev-redis-backup
  namespace: dev-data
spec:
  failedJobsHistoryLimit: 1
  jobTemplate:
    metadata:
      labels:
        app.kubernetes.io/part-of: diffusion-platform
        environment: dev
        layer: data
    spec:
      activeDeadlineSeconds: 1800
      backoffLimit: 3
      template:
        metadata:
          labels:
            app.kubernetes.io/component: backup
            app.kubernetes.io/name: redis-backup
            app.kubernetes.io/part-of: diffusion-platform
            environment: dev
            layer: data
        spec:
          containers:
          - command:
            - /bin/sh
            - -c
            - |
              DATE=$(date +%Y%m%d_%H%M%S)
              echo "Triggering Redis BGSAVE via redis-cli"
              redis-cli -h redis -a $REDIS_PASSWORD BGSAVE
              sleep 10
              # Dans Redis.yaml, le PVC redis-data est mont├⌐.
              # Le cronjob d├⌐clenche BGSAVE ΓÇö la persistance AOF/RDB s'en charge dans son propre volume.
              echo "Redis save triggered. Note: this only triggers BGSAVE on the local PV. Shipping the RDB to object storage (OVH Object Storage planned) is handled by a separate job ΓÇö TODO."
            env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: REDIS_PASSWORD
                  name: dev-diffusion-secrets
            image: redis:7.4.1-alpine
            imagePullPolicy: IfNotPresent
            name: redis-backup
            resources:
              limits:
                memory: 512Mi
              requests:
                cpu: 100m
                memory: 128Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                - ALL
              readOnlyRootFilesystem: true
            volumeMounts:
            - mountPath: /tmp
              name: tmp
          restartPolicy: OnFailure
          securityContext:
            fsGroup: 999
            runAsGroup: 999
            runAsNonRoot: true
            runAsUser: 999
            seccompProfile:
              type: RuntimeDefault
          volumes:
          - emptyDir: {}
            name: tmp
  schedule: 30 3 * * *
  successfulJobsHistoryLimit: 3
---
apiVersion: batch/v1
kind: Job
metadata:
  labels:
    app.kubernetes.io/part-of: diffusion-platform
    environment: dev
    layer: data
  name: dev-flyway-migration
  namespace: dev-data
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: diffusion-platform
        environment: dev
        layer: data
    spec:
      containers:
      - command:
        - flyway
        - migrate
        env:
        - name: FLYWAY_URL
          value: jdbc:postgresql://dev-postgres:5432/diffusion_db
        - name: FLYWAY_USER
          value: diffusion_admin
        - name: FLYWAY_PASSWORD
          valueFrom:
            secretKeyRef:
              key: POSTGRES_PASSWORD
              name: dev-diffusion-secrets
        - name: FLYWAY_LOCATIONS
          value: filesystem:/flyway/sql
        - name: FLYWAY_BASELINE_ON_MIGRATE
          value: "true"
        image: flyway/flyway:10-alpine
        name: flyway
        volumeMounts:
        - mountPath: /flyway/sql
          name: flyway-sql
      initContainers:
      - command:
        - sh
        - -c
        - |
          until pg_isready -h dev-postgres -p 5432 -U diffusion_admin -d diffusion_db; do
            echo "Waiting for dev-postgres..."
            sleep 3
          done
          echo "dev-postgres is ready."
        image: postgres:16.6-alpine
        name: wait-for-postgres
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
      restartPolicy: Never
      volumes:
      - configMap:
          name: dev-flyway-migrations
        name: flyway-sql
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 64m
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/rewrite-target: /
  labels:
    app.kubernetes.io/part-of: diffusion-platform
    environment: dev
    layer: gateway
  name: dev-diffusion-ingress
  namespace: dev-gateway
spec:
  rules:
  - host: localhost
    http:
      paths:
      - backend:
          service:
            name: dev-kong-proxy
            port:
              name: proxy
        path: /webhook/
        pathType: Prefix
      - backend:
          service:
            name: dev-n8n-main
            port:
              name: http
        path: /
        pathType: Prefix
