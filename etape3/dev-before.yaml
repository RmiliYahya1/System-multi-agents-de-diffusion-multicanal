    type: RollingUpdate
  template:
    metadata:
      labels:
        app: n8n-worker
        app.kubernetes.io/component: worker
        app.kubernetes.io/instance: n8n-worker
        app.kubernetes.io/managed-by: kustomize
        app.kubernetes.io/name: n8n-worker
        app.kubernetes.io/part-of: diffusion-platform
        app.kubernetes.io/version: 2.18.7
        environment: dev
        layer: app
    spec:
      containers:
      - args:
        - worker
        env:
        - name: DB_POSTGRESDB_PASSWORD
          valueFrom:
            secretKeyRef:
              key: POSTGRES_PASSWORD
              name: dev-diffusion-secrets
        - name: QUEUE_BULL_REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              key: REDIS_PASSWORD
              name: dev-diffusion-secrets
        - name: N8N_ENCRYPTION_KEY
          valueFrom:
            secretKeyRef:
              key: N8N_ENCRYPTION_KEY
              name: dev-diffusion-secrets
        - name: VAULT_ROOT_TOKEN
          valueFrom:
            secretKeyRef:
              key: VAULT_TOKEN
              name: dev-diffusion-secrets
        envFrom:
        - configMapRef:
            name: dev-n8n-config
        image: n8nio/n8n:2.18.7
        imagePullPolicy: IfNotPresent
        livenessProbe:
          exec:
            command:
            - sh
            - -c
            - pgrep -f 'n8n' > /dev/null
          failureThreshold: 3
          periodSeconds: 30
        name: n8n-worker
        readinessProbe:
          exec:
            command:
            - sh
            - -c
            - pgrep -f 'n8n' > /dev/null
          failureThreshold: 3
          periodSeconds: 10
        resources:
          limits:
            cpu: 1500m
            memory: 512Mi
          requests:
            cpu: 250m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        startupProbe:
          exec:
            command:
            - sh
            - -c
            - pgrep -f 'n8n' > /dev/null
          failureThreshold: 30
          periodSeconds: 10
        volumeMounts:
        - mountPath: /home/node/.n8n
          name: n8n-home
        - mountPath: /home/node/.cache
          name: n8n-cache
        - mountPath: /tmp
          name: tmp
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 300
      volumes:
      - emptyDir: {}
        name: n8n-home
      - emptyDir: {}
        name: n8n-cache
      - emptyDir: {}
        name: tmp
