      - command:
        - sh
        - -c
        - |
          cp -a /usr/local/kong/. /mnt/kong-writable/
          chmod -R a+rw /mnt/kong-writable
        image: kong:3.6.1
        name: populate-kong-dir
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: false
          runAsUser: 0
        volumeMounts:
        - mountPath: /mnt/kong-writable
          name: kong-writable
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 100
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      volumes:
      - emptyDir: {}
        name: kong-writable
      - configMap:
          name: dev-kong-declarative-config
        name: kong-config-template
      - emptyDir: {}
        name: kong-config-rendered
      - emptyDir: {}
        name: kong-pids
      - emptyDir: {}
        name: tmp
